name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Cache NuGet Packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('**/global.json', '**/*.csproj') }}
                    restore-keys: |
                        ${{ runner.os }}-dotnet10-nuget-

            -   name: Restore
                run: dotnet restore squirix.analyzers.slnx

            -   name: Build
                run: dotnet build squirix.analyzers.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

            -   name: Test
                run: dotnet test tests/squirix.analyzers.unit-tests/Squirix.Analyzers.UnitTests.csproj --configuration Release --no-build

            -   name: Pack
                run: dotnet pack src/squirix.analyzers/squirix.analyzers.csproj --configuration Release --no-build --output ./artifacts/packages

    format:
        name: Format
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Restore
                run: dotnet restore squirix.analyzers.slnx

            -   name: Format Check
                run: dotnet format squirix.analyzers.slnx --verify-no-changes --no-restore

    markdownlint:
        name: Markdownlint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Markdownlint
                uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
                with:
                    globs: '**/*.md'

    min-sdk:
        name: Minimum SDK
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   name: Set Git Options
                run: |
                    git config --global core.autocrlf false
                    git config --global core.eol lf

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Pin minimum SDK
                run: |
                    cat > global.json <<'JSON'
                    {
                      "sdk": {
                        "version": "10.0.100",
                        "rollForward": "disable"
                      },
                      "test": {
                        "runner": "Microsoft.Testing.Platform"
                      }
                    }
                    JSON

            -   name: Setup .NET
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    global-json-file: global.json

            -   name: Verify SDK
                run: dotnet --version

            -   name: Restore
                run: dotnet restore squirix.analyzers.slnx

            -   name: Build
                run: dotnet build squirix.analyzers.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

            -   name: Test
                run: dotnet test tests/squirix.analyzers.unit-tests/Squirix.Analyzers.UnitTests.csproj --configuration Release --no-build

    ci-success:
        name: CI success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs: [build, format, markdownlint, min-sdk]
        if: always()
        steps:
            -   name: Verify Required Checks
                run: |
                    fail=0
                    for result in "$RESULT_BUILD" "$RESULT_FORMAT" "$RESULT_MARKDOWNLINT" "$RESULT_MIN_SDK"; do
                        case "$result" in
                            success|skipped) ;;
                            *)
                                echo "Required check result: $result" >&2
                                fail=1
                                ;;
                        esac
                    done
                    if [ "$fail" -ne 0 ]; then
                        echo "CI success: required checks failed" >&2
                        exit 1
                    fi
                    echo "CI success: all required checks passed"
                env:
                    RESULT_BUILD: ${{ needs.build.result }}
                    RESULT_FORMAT: ${{ needs.format.result }}
                    RESULT_MARKDOWNLINT: ${{ needs.markdownlint.result }}
                    RESULT_MIN_SDK: ${{ needs.min-sdk.result }}
